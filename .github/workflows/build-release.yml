name: Create new release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go 1.26.x
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - name: Build project (amd64)
        run: >
          go build
          -o "languagetool-user-proxy-${{ github.ref_name }}.linux-x86_64"
          cmd/server/main.go

      - name: Build x86_64 (amd64) RPM
        env:
          BINARY: "languagetool-user-proxy-${{ github.ref_name }}.linux-x86_64"
          ARCH: x86_64
        run: >
          docker run
          -v .:/rpmbuild
          quay.io/centos/centos:stream10
          /rpmbuild/.rpm/build-rpm.sh
          "${BINARY}"
          "${{ github.ref_name }}"
          "${ARCH}"

      - run: file languagetool-user-proxy*

      - name: create new release
        uses: softprops/action-gh-release@v3
        with:
          files: languagetool-user-proxy*
          fail_on_unmatched_files: true
          generate_release_notes: true
