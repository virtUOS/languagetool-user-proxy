name: Go build

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.x", "1.26.x"]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build project
        run: >
          go build
          -o languagetool-user-proxy
          cmd/server/main.go

      - name: Run binary
        run: ./languagetool-user-proxy --help

      - name: Uncompress DeX OIDC provider
        run: xz --decompress .github/testdata/dex.xz

      - name: Start DeX OIDC provider
        working-directory: .github/testdata
        run: ./dex serve dex-config-languagetool.yaml &

      - name: Start backend
        run: ./.github/testdata/backend &

      - name: Start LanguageTool proxy
        run: ./languagetool-user-proxy --env-path .github/testdata/env &

      - name: Wait for services to be ready
        run: |
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:5556/dex/.well-known/openid-configuration; do sleep 1; done'
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8080; do sleep 1; done'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Playwright
        working-directory: .github/tests
        run: npm ci && npx playwright install firefox --with-deps

      - name: Run integration tests
        working-directory: .github/tests
        run: npx playwright test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: .github/tests/playwright-report/
